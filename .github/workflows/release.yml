name: Release

# Builds the installers (Windows .msi/.exe, macOS .dmg, Linux .AppImage/.deb/.rpm)
# when a vX.Y.Z tag is pushed, with a provenance attestation (SLSA) per artifact.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the draft release
      id-token: write # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without the OAuth client the app would build fine but ship without sign-in.
      - name: Require the Google OAuth client secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.STACKQUAKE_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STACKQUAKE_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Set the STACKQUAKE_GOOGLE_CLIENT_ID and STACKQUAKE_GOOGLE_CLIENT_SECRET repository secrets (docs/DEVELOPMENT.md)."
            exit 1
          fi
          case "$CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "::error::STACKQUAKE_GOOGLE_CLIENT_ID does not look like a Google OAuth client ID."; exit 1 ;;
          esac
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci --ignore-scripts
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "Desktop app" OAuth client embedded at build time (docs/DEVELOPMENT.md).
          STACKQUAKE_GOOGLE_CLIENT_ID: ${{ secrets.STACKQUAKE_GOOGLE_CLIENT_ID }}
          STACKQUAKE_GOOGLE_CLIENT_SECRET: ${{ secrets.STACKQUAKE_GOOGLE_CLIENT_SECRET }}
          # macOS code signing/notarization (optional): once the APPLE_* secrets
          # exist, uncomment these lines. Empty values would break bundling.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Stackquake ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details. Verify any installer with: `gh attestation verify <file> --repo ${{ github.repository }}`"
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
