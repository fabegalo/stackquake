[package]
name = "stackquake"
version = "0.1.0"
description = "Gestão unificada de falhas e ANRs (Play Console + Firebase Crashlytics)"
authors = ["Stackquake contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "stackquake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = ["isolation"] }
serde_json = "1.0.154"

[dependencies]
tauri = { version = "2.12.5", features = ["isolation"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Sem TLS nativo do sistema: rustls, só HTTPS, sem redirecionamentos (ver http.rs).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros"] }
# Chaveiro do sistema: Keychain (macOS), Credential Manager (Windows), Secret Service (Linux).
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
url = "2.5.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1.13.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

# Banco local criptografado com SQLCipher. No macOS usa o CommonCrypto do sistema;
# nos demais o OpenSSL é compilado junto (sem depender da versão da distro).
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher", "hooks"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
