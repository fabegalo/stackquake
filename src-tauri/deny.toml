# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
# Falha em qualquer vulnerabilidade conhecida (RustSec) ou crate retirada.
yanked = "deny"

[licenses]
# Só licenças livres e compatíveis com Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Só o crates.io oficial; nada de git ou registries alternativos.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
