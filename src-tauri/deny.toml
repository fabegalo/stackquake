# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
# Fail on any known vulnerability (RustSec) or yanked crate.
yanked = "deny"
# "Unmaintained" notices (not vulnerabilities) for transitive dependencies of
# Tauri itself, which we cannot replace. Review on every Tauri upgrade.
ignore = [
  # proc-macro-error: build-time macro used by the GTK 0.18 bindings (Linux webview).
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18 (Linux); build-time only" },
  # zbus_names / zvariant / zvariant_derive: D-Bus stack used by tauri-plugin-opener on Linux.
  { id = "RUSTSEC-2026-0370", reason = "transitive via tauri-plugin-opener -> zbus (Linux D-Bus)" },
  { id = "RUSTSEC-2026-0371", reason = "transitive via tauri-plugin-opener -> zbus (Linux D-Bus)" },
  { id = "RUSTSEC-2026-0372", reason = "transitive via tauri-plugin-opener -> zbus (Linux D-Bus)" },
]

[licenses]
# Only free licenses compatible with Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "0BSD",
]
confidence-threshold = 0.9

# SQLCipher bundles SQLite (public-domain "blessing") and libtomcrypt (WTFPL).
# Both are free and Apache-2.0 compatible; allowed for this crate only.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only the official crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
